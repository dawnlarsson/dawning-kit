name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  SHELLCHECK_VERSION: "0.10.0"

jobs:
  scripts:
    name: Scripts (syntax, shellcheck, dash)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dash
        run: sudo apt-get update && sudo apt-get install -y dash

      # Pinned: the distro's shellcheck version decides which SC3xxx POSIX
      # compatibility checks fire, so an unpinned one makes CI disagree with
      # whatever a contributor has installed locally.
      - name: Install shellcheck ${{ env.SHELLCHECK_VERSION }}
        run: |
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJ --strip-components=1 -C /usr/local/bin "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          shellcheck --version

      # The sourced kits are bash; the build scripts and the test suites must
      # stay POSIX because the README tells people to run them with `sh`,
      # which is dash here.
      - name: Parse bash scripts
        run: |
          for f in kit/bit.sh kit/emit.sh kit/doc.sh kit/utils.sh kit/test.sh; do
            echo "bash -n $f"
            bash -n "$f"
          done

      - name: Parse POSIX scripts with dash
        run: |
          for f in kit/bit.sh kit/emit.sh \
                   kit/build kit/spark kit/asm kit/common \
                   kit/config kit/verify_config kernel/replace/apply \
                   src/test/run src/test/shell.sh src/test/text.sh \
                   src/test/files.sh src/test/kit.sh src/test/probe.sh \
                   src/test/boot.sh \
                   build.sh; do
            echo "dash -n $f"
            dash -n "$f"
          done

      # Every script in the repo is shellcheck clean at -S warning; keep it that way.
      - name: shellcheck
        run: |
          shellcheck -S warning \
            kit/bit.sh kit/emit.sh kit/doc.sh kit/utils.sh kit/test.sh \
            kit/build kit/spark kit/asm kit/common \
            kit/config kit/verify_config kernel/replace/apply \
            src/test/run src/test/shell.sh src/test/text.sh \
            src/test/files.sh src/test/kit.sh src/test/probe.sh \
            src/test/boot.sh \
            build.sh

  suite:
    name: Every test (sh src/test/run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # dash is what the shell suite compares against, qemu and the two cross
      # compilers are what runs the assembly in library.c on the machines this
      # one is not, and node is what decides whether a generated wasm module
      # is a module. Each lane says so and skips itself when its tool is
      # missing, so a forgotten package here is quiet -- which is exactly why
      # they are installed rather than assumed.
      - name: Install what the lanes need
        run: |
          sudo apt-get update
          sudo apt-get install -y dash nodejs qemu-user \
            gcc-aarch64-linux-gnu gcc-riscv64-linux-gnu

      - name: Run it
        run: sh src/test/run

  clang:
    name: The library, the probes and the shell under clang
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dash
        run: sudo apt-get update && sudo apt-get install -y dash clang

      # The three lanes that compile something of ours. gcc builds them in
      # the job above; this is the same code through the other compiler,
      # which is where a freestanding link tends to differ.
      - name: Run the lanes that compile
        run: CC=clang sh src/test/run standard probe shell
